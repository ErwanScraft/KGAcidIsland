[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kgacidisland"
version = "0.1.0"
description = "Acid Island gameplay plugin for Endstone."
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.11,<0.11.12",
    "PyYAML>=6.0"
]

[project.entry-points."endstone"]
kgacidisland = "kgacidisland:KGAcidIsland"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kgacidisland = ["../../resources/*.yml"]