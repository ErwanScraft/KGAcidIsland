[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-kgacidisland"
version = "0.1.0"
description = "Acid Island gameplay for KG Survival."
authors = [
    { name = "ErwanScraft" },
]
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.11,<0.12",
]

[project.entry-points."endstone"]
kgacidisland = "kgacidisland:KGAcidIsland"

[tool.hatch.build.targets.wheel]
packages = ["src/kgacidisland"]

[tool.hatch.build.targets.wheel.force-include]
"resources/config.yml" = "kgacidisland/config.yml"
"resources/messages.yml" = "kgacidisland/messages.yml"
"resources/starter.yml" = "kgacidisland/starter.yml"